<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Unified Booking Agent - Home</title>
    <!-- Tailwind CSS CDN with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
              },
              colors: {
                'neon-purple': '#bf5af2',
                'neon-cyan': '#00d2ff',
                'deep-space': '#0a0a1a',
              },
            }
          }
        }
    </script>
    <style>
        body {
            background-color: #0a0a1a;
            background-image: radial-gradient(circle at 20% 30%, rgba(191, 90, 242, 0.15) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0, 210, 255, 0.15) 0%, transparent 40%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass-panel {
          background: rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse-glow {
          0%, 100% { box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); transform: scale(1); }
          50% { box-shadow: 0 0 30px rgba(0, 210, 255, 0.8); transform: scale(1.02); }
        }

        .btn-glow {
          animation: pulse-glow 3s infinite ease-in-out;
        }

        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative">
    
    <!-- Decorative background elements -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-neon-purple/20 rounded-full blur-[100px] -z-10"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-neon-cyan/20 rounded-full blur-[100px] -z-10"></div>

    <main class="w-full max-w-6xl px-6 flex flex-col md:flex-row items-center justify-between gap-12 z-10">
        
        <!-- Text Content -->
        <div class="flex-1 text-center md:text-left space-y-8">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-panel border border-neon-purple/30 text-neon-purple text-sm font-semibold tracking-widest uppercase mb-4">
                <i class="fas fa-microchip"></i> Powered by MCP & Gemini AI
            </div>
            
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight leading-tight">
                The Future of <br />
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-purple to-neon-cyan">
                    Travel Booking.
                </span>
            </h1>
            
            <p class="text-lg md:text-xl text-white/70 max-w-xl leading-relaxed">
                Experience a unified, AI-driven search across multiple platforms. Simply describe your ideal stay, and let the agent do the heavy lifting.
            </p>
            
            <div class="pt-8">
                <a href="/chat" class="inline-flex items-center justify-center gap-3 px-8 py-4 bg-gradient-to-r from-neon-cyan to-blue-500 rounded-full text-lg font-bold text-deep-space btn-glow hover:opacity-90 transition-all">
                    Launch AI Interface <i class="fas fa-arrow-right"></i>
                </a>
            </div>

            <div class="pt-12 flex gap-8 justify-center md:justify-start">
                <div class="flex flex-col gap-1">
                    <span class="text-3xl font-bold text-white">3+</span>
                    <span class="text-xs text-white/50 uppercase tracking-widest">Platforms</span>
                </div>
                <div class="flex flex-col gap-1">
                    <span class="text-3xl font-bold text-white">GenAI</span>
                    <span class="text-xs text-white/50 uppercase tracking-widest">Natural Parsing</span>
                </div>
                <div class="flex flex-col gap-1">
                    <span class="text-3xl font-bold text-white"><i class="fas fa-bolt text-yellow-400"></i></span>
                    <span class="text-xs text-white/50 uppercase tracking-widest">Real-time</span>
                </div>
            </div>
        </div>

        <!-- 3D/Visual Elements -->
        <div class="flex-1 relative floating hidden md:flex justify-center items-center">
            <div class="relative w-80 h-80">
                <!-- Outer Ring -->
                <div class="absolute inset-0 border-2 border-neon-cyan/30 rounded-full border-dashed animate-[spin_20s_linear_infinite]"></div>
                <!-- Inner Ring -->
                <div class="absolute inset-4 border border-neon-purple/50 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
                
                <!-- Core Card -->
                <div class="absolute inset-12 glass-panel rounded-3xl border border-white/20 p-6 flex flex-col justify-center items-center shadow-[0_0_50px_rgba(191,90,242,0.3)]">
                    <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-neon-purple to-neon-cyan p-0.5 mb-6 shadow-[0_0_30px_rgba(191,90,242,0.4)]">
                        <div class="w-full h-full bg-deep-space rounded-xl flex items-center justify-center p-2">
                            <img src="/static/logo.png" alt="Unified Booking Agent Logo" class="w-full h-full object-contain drop-shadow-md">
                        </div>
                    </div>
                    <div class="h-2 w-24 bg-white/20 rounded-full mb-3"></div>
                    <div class="h-2 w-16 bg-white/20 rounded-full mb-6"></div>
                    <div class="flex gap-2">
                        <div class="w-8 h-8 rounded-full bg-blue-500/20 border border-blue-500/50 flex items-center justify-center"><i class="fab fa-airbnb text-xs text-blue-400"></i></div>
                        <div class="w-8 h-8 rounded-full bg-indigo-500/20 border border-indigo-500/50 flex items-center justify-center"><i class="fas fa-hotel text-xs text-indigo-400"></i></div>
                        <div class="w-8 h-8 rounded-full bg-green-500/20 border border-green-500/50 flex items-center justify-center"><i class="fas fa-leaf text-xs text-green-400"></i></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
